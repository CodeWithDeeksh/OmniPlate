services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: omniplate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omniplate
      POSTGRES_USER: omniplate
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniplate -d omniplate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
